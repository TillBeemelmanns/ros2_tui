[package]
name = "ros2_tui"
version = "0.1.10"
authors = ["Till Beemelmanns <till.beemelmanns@gmail.com>"]
description = "A Terminal User Interface (TUI) for monitoring and managing ROS2 topics and parameters"
repository = "https://github.com/Tillbeemelmanns/ros2_tui"
license = "MIT"
edition = "2021"
readme = "README.md"
homepage = "https://github.com/Tillbeemelmanns/ros2_tui"
documentation = "https://docs.rs/ros2_tui"
keywords = ["ros2", "tui", "terminal", "monitoring", "robotics"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "/.github/*",
    "/target/*",
    "*.log"
]

[[bin]]
name = "topics"
path = "src/bin/topics.rs"

[[bin]]
name = "params"
path = "src/bin/params.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam = "0.8.5"
crossterm = "0.29.0"
flate2 = "1.1.2"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
lazy_static = "1.5.1"
libc = "0.2.177"
once_cell = "1.21.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "process", "time", "macros", "io-util", "fs", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
